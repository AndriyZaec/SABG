[package]
name = "arena"
version = "0.1.0"
description = "SABG arena escrow, entry pass and payout program (Solana devnet)."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Preserve cancel_arena calls that omit its new trailing optional account.
anchor-lang = { version = "0.32.1", features = ["allow-missing-optionals"] }
